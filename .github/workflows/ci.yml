name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  spring-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend
        working-directory: tms-backend
        run: mvn -B test

  aspnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build ASP.NET reports service
        run: dotnet build tms-dotnet-reports/TmsReports.csproj --configuration Release
