apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tms-postgres-pvc
  namespace: tms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tms-postgres
  namespace: tms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tms-postgres
  template:
    metadata:
      labels:
        app: tms-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tmsdb
            - name: POSTGRES_USER
              value: tms
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tms", "-d", "tmsdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tms-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tms-postgres
  namespace: tms
spec:
  selector:
    app: tms-postgres
  ports:
    - port: 5432
      targetPort: 5432
