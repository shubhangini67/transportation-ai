<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-label="Assign request sequence">
  <rect width="1180" height="640" rx="18" fill="#F6F1E8"/>
  <rect x="1" y="1" width="1178" height="638" rx="18" fill="none" stroke="#E4D9C8" stroke-width="2"/>

  <text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F3D32">Request flow - Assign a run</text>
  <text x="40" y="72" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6B6258">Spring Boot is the API gateway. React never calls ASP.NET Core. If C# is unreachable, Java still returns a plan.</text>

  <!-- swimlanes -->
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="90" y="112" font-size="12" font-weight="700" fill="#1F3D32" text-anchor="middle">Dispatcher</text>
    <text x="290" y="112" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle">React</text>
    <text x="490" y="112" font-size="12" font-weight="700" fill="#1F3D32" text-anchor="middle">Spring Boot</text>
    <text x="700" y="112" font-size="12" font-weight="700" fill="#336791" text-anchor="middle">PostgreSQL</text>
    <text x="930" y="112" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">ASP.NET Core</text>
  </g>

  <line x1="90" y1="124" x2="90" y2="590" stroke="#D9D0C4" stroke-dasharray="4 6"/>
  <line x1="290" y1="124" x2="290" y2="590" stroke="#D9D0C4" stroke-dasharray="4 6"/>
  <line x1="490" y1="124" x2="490" y2="590" stroke="#D9D0C4" stroke-dasharray="4 6"/>
  <line x1="700" y1="124" x2="700" y2="590" stroke="#D9D0C4" stroke-dasharray="4 6"/>
  <line x1="930" y1="124" x2="930" y2="590" stroke="#D9D0C4" stroke-dasharray="4 6"/>

  <defs>
    <marker id="s" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3F4A44"/></marker>
  </defs>

  <!-- 1 -->
  <line x1="90" y1="150" x2="290" y2="150" stroke="#3F4A44" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="118" y="128" width="150" height="22" rx="6" fill="#FFFDF9"/>
  <text x="193" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#3F4A44" text-anchor="middle">1  Open Assign</text>

  <!-- 2 -->
  <line x1="290" y1="198" x2="490" y2="198" stroke="#3F4A44" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="300" y="176" width="176" height="22" rx="6" fill="#E7F4F2"/>
  <text x="388" y="192" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#134E4A" text-anchor="middle">2  JWT + X-Tenant-ID</text>

  <!-- 3 -->
  <line x1="490" y1="246" x2="700" y2="246" stroke="#3F4A44" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="512" y="224" width="168" height="22" rx="6" fill="#E8F1F8"/>
  <text x="596" y="240" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#1E3A5F" text-anchor="middle">3  Load fleet snapshot</text>

  <line x1="700" y1="276" x2="490" y2="276" stroke="#3F4A44" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="512" y="254" width="168" height="22" rx="6" fill="#FFFDF9"/>
  <text x="596" y="270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5348" text-anchor="middle">trucks | crew | lanes</text>

  <!-- 4 -->
  <line x1="490" y1="330" x2="930" y2="330" stroke="#5B21B6" stroke-width="1.8" marker-end="url(#s)"/>
  <rect x="560" y="308" width="300" height="22" rx="6" fill="#F3EEFF"/>
  <text x="710" y="324" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#4C1D95" text-anchor="middle">4  POST snapshot  |  X-Internal-Api-Key</text>

  <line x1="930" y1="372" x2="490" y2="372" stroke="#5B21B6" stroke-width="1.8" marker-end="url(#s)"/>
  <rect x="560" y="350" width="300" height="22" rx="6" fill="#F3EEFF"/>
  <text x="710" y="366" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#4C1D95" text-anchor="middle">5  Ranked truck-driver plan</text>

  <!-- alt -->
  <rect x="420" y="400" width="620" height="70" rx="10" fill="#FDF0E9" stroke="#E8C4AE" stroke-dasharray="5 4"/>
  <text x="436" y="424" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#C45C26">ALT  C# unreachable</text>
  <text x="436" y="446" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#7C2D12">DotNetReportsClient throws | DispatchService uses Spring fallback scoring. Assign still opens.</text>
  <text x="436" y="464" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#7C2D12">Same pattern on Insights  (/api/v1/insights/fleet).</text>

  <!-- 6 -->
  <line x1="490" y1="500" x2="290" y2="500" stroke="#3F4A44" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="308" y="478" width="164" height="22" rx="6" fill="#E7F4F2"/>
  <text x="390" y="494" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#134E4A" text-anchor="middle">6  DispatchPlan DTO</text>

  <!-- 7 -->
  <line x1="290" y1="548" x2="490" y2="548" stroke="#1F3D32" stroke-width="1.8" marker-end="url(#s)"/>
  <rect x="308" y="526" width="164" height="22" rx="6" fill="#E8F0EC"/>
  <text x="390" y="542" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#1F3D32" text-anchor="middle">7  Confirm | create trip</text>

  <line x1="490" y1="580" x2="700" y2="580" stroke="#1F3D32" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="512" y="558" width="168" height="22" rx="6" fill="#E8F0EC"/>
  <text x="596" y="574" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#1F3D32" text-anchor="middle">8  Truck status BUSY</text>
</svg>
