  <text x="266" y="496" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5C5348">toResponse()  DTOs</text>
  <rect x="440" y="448" width="170" height="70" rx="8" fill="#E8F0EC" stroke="#B7C9BF"/>
  <text x="456" y="476" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F3D32">Repository</text>
  <text x="456" y="496" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5C5348">Spring Data JPA</text>
  <rect x="630" y="448" width="170" height="70" rx="8" fill="#E8F0EC" stroke="#B7C9BF"/>
  <text x="646" y="476" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F3D32">Entity</text>
  <text x="646" y="496" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5C5348">extends Auditable</text>
  <rect x="820" y="448" width="300" height="70" rx="8" fill="#E8F0EC" stroke="#B7C9BF"/>
  <text x="836" y="476" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1F3D32">Never return JPA entities</text>
  <text x="836" y="496" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5C5348">GlobalExceptionHandler  |  custom errors</text>

  <!-- L5 -->
  <rect x="36" y="554" width="1108" height="118" rx="12" fill="#FFFDF9" stroke="#D9D0C4"/>
  <rect x="36" y="554" width="8" height="118" rx="4" fill="#5B21B6"/>
