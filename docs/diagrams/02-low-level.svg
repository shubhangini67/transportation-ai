  <text x="338" y="261" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#065F46">location /api/  |  tms-backend:8080</text>
  <rect x="632" y="244" width="280" height="24" rx="6" fill="#ECFDF5"/>
  <text x="644" y="261" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#065F46">location /ws/  |  WebSocket upgrade</text>
