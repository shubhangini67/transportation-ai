  <rect x="472" y="596" width="180" height="56" rx="8" fill="#F3EEFF" stroke="#D4C6F0"/>
  <text x="488" y="620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4C1D95">GeofenceService</text>
  <text x="488" y="638" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B6258">Haversine check</text>
  <rect x="668" y="596" width="160" height="56" rx="8" fill="#F3EEFF" stroke="#D4C6F0"/>
  <text x="684" y="620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4C1D95">AiCopilot</text>
  <text x="684" y="638" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B6258">live TMS facts</text>
  <rect x="844" y="596" width="140" height="56" rx="8" fill="#F3EEFF" stroke="#D4C6F0"/>
  <text x="860" y="620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4C1D95">OpenPDF</text>
  <text x="860" y="638" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B6258">LR + invoice</text>
  <rect x="1000" y="596" width="120" height="56" rx="8" fill="#F3EEFF" stroke="#D4C6F0"/>
  <text x="1014" y="620" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4C1D95">Webhooks</text>
  <text x="1014" y="638" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6B6258">retry + HMAC</text>

  <!-- L6 -->
  <rect x="36" y="688" width="1108" height="100" rx="12" fill="#FFFDF9" stroke="#D9D0C4"/>
  <rect x="36" y="688" width="8" height="100" rx="4" fill="#336791"/>
  <text x="60" y="714" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#336791" letter-spacing="1.4">L6  DATA</text>
