  <text x="60" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="1.4">L2  INGRESS  (Nginx in the frontend image)</text>
  <rect x="60" y="244" width="250" height="24" rx="6" fill="#ECFDF5"/>
