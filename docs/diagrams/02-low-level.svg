  <text x="324" y="361" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#7C2D12">JwtAuthenticationFilter</text>
  <text x="568" y="361" font-size="16" fill="#C45C26">|</text>
  <rect x="596" y="338" width="230" height="36" rx="8" fill="#FDF0E9" stroke="#E8C4AE"/>
  <text x="612" y="361" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#7C2D12">@PreAuthorize  RBAC</text>
