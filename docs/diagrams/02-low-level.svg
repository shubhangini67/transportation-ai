<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" role="img" aria-label="Low-level architecture">
  <rect width="1180" height="820" rx="18" fill="#F6F1E8"/>
  <rect x="1" y="1" width="1178" height="818" rx="18" fill="none" stroke="#E4D9C8" stroke-width="2"/>

  <text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1F3D32">Low-level architecture</text>
  <text x="40" y="72" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#6B6258">Layered request path inside Spring Boot, plus the only outbound call to the C# scoring service.</text>

  <!-- L1 -->
  <rect x="36" y="96" width="1108" height="92" rx="12" fill="#FFFDF9" stroke="#D9D0C4"/>
  <rect x="36" y="96" width="8" height="92" rx="4" fill="#0F766E"/>
  <text x="60" y="122" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="1.4">L1  CLIENT</text>
  <rect x="60" y="136" width="200" height="36" rx="8" fill="#E7F4F2" stroke="#B7D9D4"/>
  <text x="76" y="159" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#134E4A">Pages  (RBAC routes)</text>
  <rect x="276" y="136" width="220" height="36" rx="8" fill="#E7F4F2" stroke="#B7D9D4"/>
  <text x="292" y="159" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#134E4A">src/services  |  Axios</text>
  <rect x="512" y="136" width="200" height="36" rx="8" fill="#E7F4F2" stroke="#B7D9D4"/>
  <text x="528" y="159" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#134E4A">AuthContext + refresh</text>
  <rect x="728" y="136" width="180" height="36" rx="8" fill="#E7F4F2" stroke="#B7D9D4"/>
  <text x="744" y="159" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#134E4A">STOMP  SockJS</text>
  <rect x="924" y="136" width="196" height="36" rx="8" fill="#E7F4F2" stroke="#B7D9D4"/>
  <text x="940" y="159" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#134E4A">X-Tenant-ID header</text>

